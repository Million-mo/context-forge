[package]
name = "context-forge"
version = "0.1.0"
edition = "2021"
description = "macOS-first TUI manager for RTK and Caveman"
license = "MIT"

[[bin]]
name = "context-forge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
directories = "5"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
